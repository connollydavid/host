name: Prose

# The front-door obeys the prose rule the methodology publishes (plan/0038): authored
# markdown carries zero prose tropes. `host-lifecycle prose .` is host-lint's `--docs`
# engine run in-process; it exits non-zero on any flag or warning.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  prose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A floor, not an equality claim (call/0052): this lane installs a driver to read this
      # repository's own prose and ships it to nobody, so it declares the minimum it needs
      # rather than tracking the host's anchor. Currently v0.49.1, which embeds host-lint
      # v0.17.0 and its reconciled word-choice rules. The LEXICON-honouring behaviour this
      # comment used to cite still exists; this repository has simply never carried one, and
      # under the reconciled rules its prose is clean with no declaration at all (call/0051).
      # The host reads every pin like this one and reports any sitting below its anchor.
      - name: Install host-lifecycle (pinned)
        run: cargo install --locked --git https://github.com/connollydavid/host-lifecycle --rev 2ae8b1e911b89a169144051bcb22fc13b3d22e50 --root "$HOME/.local"
      - name: Prose gate (zero tropes in authored docs)
        run: "$HOME/.local/bin/host-lifecycle prose ."
